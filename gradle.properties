# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Updated to recommended values (AGP 9.0+)
android.defaults.buildfeatures.resvalues=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true

# Suppress library components warning
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Fix for KSP 'classpathSnapshotProperties.useClasspathSnapshot' error
ksp.incremental=false

# Use current DSL (AGP 9.0)
android.builtInKotlin=false
android.newDsl=false

# Disable incremental compilation to avoid file lock issues on Windows
kotlin.incremental=false
